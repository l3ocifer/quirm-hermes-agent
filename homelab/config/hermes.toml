# Quirm — Hermes Agent config
# Researcher, benchmarker, prototyper. Leonardo of Quirm in the tower.

[agent]
name = "Quirm"
id = "quirm"
role = "research-benchmarking-capability-expansion"
timezone = "America/New_York"
hardstop_path = "/data/HARDSTOP-QUIRM"

[gateway]
bind = "0.0.0.0:3001"
metrics_bind = "0.0.0.0:9100"

[providers.litellm]
base_url = "http://litellm.inference.svc.cluster.local:4000/v1"
api_key_env = "LITELLM_API_KEY"
default_model = "chat"

[memory]
backend = "postgres"
url_env = "DATABASE_URL"

[memory.logseq]
graphs = [
  { id = "quirm",    path = "/data/graphs/quirm",    writable = true },
  { id = "leo",      path = "/data/graphs/leo",      writable = true, writable_paths = ["pages/agent-coordination/", "pages/research-memos/"] },
  { id = "frick",    path = "/data/graphs/frick",    writable = false },
  { id = "frack",    path = "/data/graphs/frack",    writable = false },
  { id = "sancho",   path = "/data/graphs/sancho",   writable = false },
  { id = "vetinari", path = "/data/graphs/vetinari", writable = false },
  { id = "vimes",    path = "/data/graphs/vimes",    writable = false },
  { id = "puck",     path = "/data/graphs/puck",     writable = false },
]

[tools]
enabled = ["terminal", "code-execution", "web-search", "browser", "memory", "mcp", "bluebubbles"]
disabled = ["homeassistant", "stripe", "kubectl-write"]

[tools.terminal]
backend = "docker"

[a2a]
listen_bind = "0.0.0.0:50051"
shared_secret_env = "OFP_SHARED_SECRET"

[[a2a.peers]]
id  = "frick"
url = "http://frick.agents-shared.svc:3000"

[[a2a.peers]]
id  = "frack"
url = "http://frack.agents-shared.svc:18789"

[[a2a.peers]]
id  = "sancho"
url = "http://sancho.agents-shared.svc:3001"

[[a2a.peers]]
id  = "vetinari"
url = "http://vetinari.agents-shared.svc:4200"

[[a2a.peers]]
id  = "vimes"
url = "http://vimes.agents-shared.svc:3000"

[[a2a.peers]]
id  = "puck"
url = "http://puck.agents-shared.svc:18789"

[channels]
matrix   = { homeserver_env = "MATRIX_HOMESERVER", token_env = "MATRIX_ACCESS_TOKEN", user = "@quirm:leopaska.xyz" }
telegram = { token_env = "TELEGRAM_BOT_TOKEN", chat_id_env = "TELEGRAM_CHAT_ID_QUIRM" }
ntfy     = { url = "https://ntfy.leopaska.xyz/quirm", token_env = "NTFY_TOKEN" }
bluebubbles = { base_url = "http://bluebubbles-proxy.agents-shared.svc.cluster.local:8080", api_key_env = "BLUEBUBBLES_API_KEY", webhook_path = "/imessage/inbound" }

[quiet_hours]
start = "22:00"
end   = "06:00"

[killswitch]
hardstop_file = "/data/HARDSTOP-QUIRM"

[heartbeat]
url = "https://hc-ping.com/quirm-${HEALTHCHECKS_UUID}"
every_minutes = 30

[cron]
[[cron.tasks]]
schedule = "0 6 * * *"
prompt   = "Run the daily benchmark digest. Compare yesterday's runs to the trailing 7-day window. Flag any P95 latency regression > 20% or cost increase > 30%. Send the user-facing summary via BlueBubbles/iMessage and to vetinari (A2A) so he has it for the morning briefing. Save the full report to quirm-graph/pages/runs/."
delivery = ["bluebubbles"]

[[cron.tasks]]
schedule = "0 9 * * 0"
prompt   = "Weekly methodology review. Re-run any benchmark from the past 7 days that produced surprising results. Check statistical significance. Update the eval harness if any rubric needs revision. Post a one-page memo to quirm-graph/pages/memos/. Send the user-facing summary via BlueBubbles/iMessage, and send vimes a list of any new prototypes from the past week so he can flag any that should not deploy."
delivery = ["bluebubbles"]

# ─── Fleet event bus ─────────────────────────────────────────────────
# Durable async A2A backbone shared by all seven agents. Connection
# string sealed in quirm-secrets as FLEET_DATABASE_URL.
[fleet]
enabled = true
agent_id = "quirm"
database_url_env = "FLEET_DATABASE_URL"
notify_channel = "fleet_events_new"
# Quirm is the research/benchmarking agent — wakes for P0s, broadcasts,
# explicit pings, plus any benchmark/eval/research event.
inbound_predicate = "severity = 'p0' OR target IS NULL OR target = 'quirm' OR kind LIKE 'research.%' OR kind LIKE 'eval.%' OR kind LIKE 'benchmark.%'"
