# Quirm — Hermes Agent config
# Researcher, benchmarker, prototyper. Leonardo of Quirm in the tower.

[agent]
name = "Quirm"
id = "quirm"
role = "research-benchmarking-capability-expansion"
timezone = "America/New_York"
hardstop_path = "/data/HARDSTOP-QUIRM"

[gateway]
bind = "0.0.0.0:3001"
metrics_bind = "0.0.0.0:9100"

[providers.litellm]
# Fleet default is `chat` (vllm-chat / Qwen3.5 27B AWQ on thebeast).
# `long` and `frontier` are opt-in per [[cron.tasks]] entry via
# `model = "long"` / `model = "frontier"`. Frontier is intentionally
# excluded from auto-fallbacks (CPU-only, ~3-5 tok/s).
base_url = "http://litellm.inference.svc.cluster.local:4000/v1"
api_key_env = "LITELLM_API_KEY"
default_model = "chat"
fallbacks = ["long"]
models = ["chat", "long", "frontier", "embed", "rerank"]

[memory]
backend = "postgres"
url_env = "DATABASE_URL"

[memory.logseq]
graphs = [
  { id = "quirm",    path = "/data/graphs/quirm",    writable = true },
  { id = "leo",      path = "/data/graphs/leo",      writable = true, writable_paths = ["pages/agent-coordination/", "pages/research-memos/"] },
  { id = "frick",    path = "/data/graphs/frick",    writable = false },
  { id = "frack",    path = "/data/graphs/frack",    writable = false },
  { id = "sancho",   path = "/data/graphs/sancho",   writable = false },
  { id = "vetinari", path = "/data/graphs/vetinari", writable = false },
  { id = "vimes",    path = "/data/graphs/vimes",    writable = false },
  { id = "puck",     path = "/data/graphs/puck",     writable = false },
]

[tools]
enabled = ["terminal", "code-execution", "web-search", "browser", "memory", "mcp", "bluebubbles"]
disabled = ["homeassistant", "stripe", "kubectl-write"]

[tools.terminal]
backend = "docker"

[a2a]
listen_bind = "0.0.0.0:50051"
shared_secret_env = "OFP_SHARED_SECRET"

[[a2a.peers]]
id  = "frick"
url = "http://frick.agents-shared.svc:3000"

[[a2a.peers]]
id  = "frack"
url = "http://frack.agents-shared.svc:18789"

[[a2a.peers]]
id  = "sancho"
url = "http://sancho.agents-shared.svc:3001"

[[a2a.peers]]
id  = "vetinari"
url = "http://vetinari.agents-shared.svc:4200"

[[a2a.peers]]
id  = "vimes"
url = "http://vimes.agents-shared.svc:3000"

[[a2a.peers]]
id  = "puck"
url = "http://puck.agents-shared.svc:18789"

[channels]
matrix   = { homeserver_env = "MATRIX_HOMESERVER", token_env = "MATRIX_ACCESS_TOKEN", user = "@quirm:leopaska.xyz" }
telegram = { token_env = "TELEGRAM_BOT_TOKEN", chat_id_env = "TELEGRAM_CHAT_ID_QUIRM" }
ntfy     = { url = "https://ntfy.leopaska.xyz/quirm", token_env = "NTFY_TOKEN" }
bluebubbles = { base_url = "http://bluebubbles-proxy.agents-shared.svc.cluster.local:8080", api_key_env = "BLUEBUBBLES_API_KEY", webhook_path = "/imessage/inbound" }

[quiet_hours]
start = "22:00"
end   = "06:00"

[killswitch]
hardstop_file = "/data/HARDSTOP-QUIRM"

[heartbeat]
url = "https://hc-ping.com/quirm-${HEALTHCHECKS_UUID}"
every_minutes = 30

[cron]

# ─── Karpathy-style auto-research loop ───────────────────────────────
# The mechanical half of the loop runs as standalone k8s CronJobs:
#   quirm-bench-runner    every 1m   pops one bench.experiments row,
#                                    calls LiteLLM, writes metrics +
#                                    auto-grader score back, emits
#                                    findings on regression / cliff.
#   quirm-bench-proposer  every 30m  reads coverage gaps + top-N
#                                    candidates, queues new experiments
#                                    (coverage, confirm, explore).
# This Hermes cron is the *human* half — Quirm reads bench.* state,
# narrates what happened, and decides what to escalate.
# Tables: bench.prompts, bench.experiments, bench.findings.

[[cron.tasks]]
name     = "bench-pulse"
schedule = "*/15 * * * *"
# default model (long) — small SQL pulse, no reasoning.
prompt   = """
Pulse-check the benchmark loop. Run these three SQL queries against
hermes_quirm (DATABASE_URL):

  SELECT count(*) AS queued FROM bench.experiments WHERE status='queued';
  SELECT count(*) AS running FROM bench.experiments WHERE status='running'
     AND started_at > now() - interval '10 min';
  SELECT count(*) AS unseen_findings FROM bench.findings WHERE seen_by_user=false;

If queued=0 and running=0, the loop is starved — log a one-line
warning to journals and ping vetinari via A2A (kind=research.starved).
If unseen_findings > 0, do nothing — the daily digest will surface
them. Otherwise stay silent. Keep this turn under 30 seconds.
"""
delivery = []

[[cron.tasks]]
name     = "bench-digest-daily"
schedule = "0 6 * * *"
model    = "frontier"  # daily research synthesis; reasoning quality matters
prompt   = """
Daily benchmark digest, Karpathy-style. Read from `bench.experiments`
and `bench.findings` in hermes_quirm and produce a single iMessage:

  • What ran in the last 24h  (count + which models / prompts)
  • Best-on-pareto today      (top 3 by score per model class)
  • Worst regressions         (any bench.findings rows where severity
                               in 'notable','important','urgent')
  • Open questions            (model × prompt pairs with <3 done runs
                               that the proposer hasn't filled yet)

Write the full long-form report to quirm-graph/pages/runs/YYYY-MM-DD.md.
Send the iMessage summary to Leo (≤4 paragraphs). Send the same
summary to vetinari via A2A (kind=research.daily-digest) so the
morning briefing can cite it.

After sending, mark the surfaced bench.findings rows as seen:
  UPDATE bench.findings SET seen_by_user=true WHERE id = ANY($1);
"""
delivery = ["bluebubbles"]

[[cron.tasks]]
name     = "bench-weekly-review"
schedule = "0 9 * * 0"
model    = "frontier"  # weekly methodology review; deepest reasoning required
prompt   = """
Weekly methodology review. Read bench.model_summary view + the past
7 days of bench.findings. Identify:

  1. Models that consistently land on the pareto frontier.
  2. Prompts where every model scores <0.6 — likely a bad prompt or
     a real capability gap. Propose a rewrite or a new prompt.
  3. Coverage gaps that the proposer hasn't filled — figure out why
     (model unavailable? prompt too long for window?).

Write a one-page memo to quirm-graph/pages/memos/. Send the
user-facing summary to Leo via iMessage. Send vimes a list of any
new prototypes that produced strong results so he can flag any that
should not deploy. If a new model alias should be added to the
catalog, also write a proposal to quirm-graph/pages/proposals/.
"""
delivery = ["bluebubbles"]

[[cron.tasks]]
name     = "bench-frontier-ceiling"
schedule = "30 4 * * *"  # 04:30 — between Sancho (03:50) and the morning sweep
model    = "frontier"
# Karpathy-style "what's the ceiling?" pass. Once a day, queue a
# frontier-pinned experiment for every prompt in `bench.prompts`
# (skip ones with a fresh frontier run in the last 24h). The runner
# CronJob picks them up. Establishes a per-prompt quality ceiling so
# the daily digest can compare chat / long / frontier on the same
# axis and flag regressions when a smaller model rivals frontier.
prompt   = """
Frontier ceiling pass. For every row in bench.prompts that does NOT
already have a `bench.experiments` row with model='frontier' and
status='done' AND finished_at > now() - interval '24 hours', insert:

  INSERT INTO bench.experiments
    (prompt_id, model, params, status, queued_at)
  VALUES
    ($1, 'frontier',
     '{"temperature": 0.2, "max_tokens": 2048}'::jsonb,
     'queued', now())
  ON CONFLICT DO NOTHING;

Cap at 30 inserts per run (token budget). The runner CronJob will
execute them. Stay silent unless the insert fails.
"""
delivery = []

# ─── Fleet event bus ─────────────────────────────────────────────────
# Durable async A2A backbone shared by all seven agents. Connection
# string sealed in quirm-secrets as FLEET_DATABASE_URL.
[fleet]
enabled = true
agent_id = "quirm"
database_url_env = "FLEET_DATABASE_URL"
notify_channel = "fleet_events_new"
# Quirm is the research/benchmarking agent — wakes for P0s, broadcasts,
# explicit pings, plus any benchmark/eval/research event.
inbound_predicate = "severity = 'p0' OR target IS NULL OR target = 'quirm' OR kind LIKE 'research.%' OR kind LIKE 'eval.%' OR kind LIKE 'benchmark.%'"
