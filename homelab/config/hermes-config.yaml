# Quirm's Hermes inference configuration. Routes through the
# in-cluster LiteLLM proxy (inference namespace) which fronts the
# vLLM, embedding, and rerank services running on the homelab GPUs.
#
# Default model: `long` — vllm-long on alef (RTX 3090),
# Qwen3.5-9B-AWQ + DeltaNet, 262 K input ctx. Smaller-but-fast and
# satisfies Hermes-Agent's hard ≥64 K context floor enforced in
# run_agent.py L2020 (vllm-chat's 20 K ctx hits this and crashes the
# agent loop).  `chat` (20 K, 27B) and `frontier` (65 K, 480B MoE)
# remain opt-in per-cron-task in hermes.toml via `model = "chat"` /
# `model = "frontier"`.  Hermes' compressor uses the active model's
# context_length below, so per-task overrides automatically get the
# right window.

model:
  # 2026-05-12: vllm-long hanging (120s timeouts). Temporary chat default;
  # litellm fallback routes overflow back to long when it recovers.
  default: chat
  provider: litellm
  context_length: 65536

providers:
  litellm:
    name: LiteLLM Homelab
    base_url: http://litellm.inference.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY
    api_mode: chat_completions
    default_model: chat
    context_length: 65536
    models:
      chat:
        # vllm-chat (thebeast / RTX 3090Ti) — Qwen3.6 27B AWQ INT4.
        # Actual served context is 20 K (LiteLLM
        # `chat.model_info.max_input_tokens=20480`).  We DELIBERATELY
        # lie to Hermes here and report 65 K to satisfy its hard
        # ≥64 K floor (run_agent.py L2020) — otherwise a task that
        # opts into `model = "chat"` via hermes.toml crashes the
        # AIAgent init.  The 40-litellm-config.yaml fallback
        # `chat: ["long"]` catches any prompt that actually
        # overflows the real 20 K window and re-routes to vllm-long,
        # so the lie is safe in practice.  Drop back to 20480 once
        # the fleet default is on a 64 K+ model (Qwen3.6-35B-A3B on
        # alef, in progress as of 2026-05-12).
        context_length: 65536
      long:
        # vllm-long (alef / RTX 3090) — Qwen3.5 9B AWQ + DeltaNet.
        # Native 262 K context. Use for big synthesis / long sessions.
        context_length: 262144
      frontier:
        # llamacpp-blade-frontier — unsloth Qwen3-Coder 480B-A35B GGUF
        # Q4_K_M on dual Xeon E5-2667 v2. CPU-only, ~3-5 tok/s. Capped
        # at 64 K ctx to keep KV in headroom; mirrors LiteLLM
        # `frontier.model_info.max_input_tokens`. Already ≥64 K so no
        # Hermes-floor lie needed.
        context_length: 65536

# 2026-05-29: Enable hard-stop guardrails. Default Hermes ships warnings-only,
# which lets the model burn LiteLLM quota on `skill_manage` (and similar) loops
# — it sees the warning text appended to tool output but keeps retrying. Hard
# stops actively block/halt the loop after the thresholds below. Quirm runs
# benchmarker + researcher loops where runaway retries on a broken capability
# can quietly chew through tokens, so hard stop is more important than the
# CLI's gentle-nudge default.
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 4
    same_tool_failure: 6
    idempotent_no_progress: 4
