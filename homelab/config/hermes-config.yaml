# Quirm's Hermes inference configuration. Routes through the
# in-cluster LiteLLM proxy (inference namespace) which fronts the
# vLLM, embedding, and rerank services running on the homelab GPUs.
#
# Fleet default: `chat` — vllm-chat on thebeast (RTX 4090),
# QuantTrio Qwen3.5-27B-AWQ-INT4, 20 K input ctx, ~80 tok/s.
# `long` (262 K) and `frontier` (65 K, 480B MoE) are opt-in per-cron-task
# in hermes.toml via `model = "long"` / `model = "frontier"`. Hermes'
# compressor uses the active model's context_length below, so per-task
# overrides automatically get the right window.

model:
  default: chat
  provider: litellm
  context_length: 20480

providers:
  litellm:
    name: LiteLLM Homelab
    base_url: http://litellm.inference.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY
    api_mode: chat_completions
    default_model: chat
    context_length: 20480
    models:
      chat:
        # vllm-chat (thebeast / RTX 4090) — Qwen3.5 27B AWQ INT4.
        # Mirrors LiteLLM `chat.model_info.max_input_tokens`.
        context_length: 20480
      long:
        # vllm-long (alef / RTX 3090) — Qwen3.5 9B AWQ + DeltaNet.
        # Native 262 K context. Use for big synthesis / long sessions.
        context_length: 262144
      frontier:
        # llamacpp-blade-frontier — unsloth Qwen3-Coder 480B-A35B GGUF
        # Q4_K_M on dual Xeon E5-2667 v2. CPU-only, ~3-5 tok/s. Capped
        # at 64 K ctx to keep KV in headroom; mirrors LiteLLM
        # `frontier.model_info.max_input_tokens`.
        context_length: 65536
