---
# Quirm benchmark loop — Karpathy-style auto-research.
#
# runner   every 1m  → executes one queued experiment (FOR UPDATE SKIP LOCKED)
# proposer every 30m → fills coverage gaps, confirms top-N, explores
#
# Both share the same ConfigMap-mounted Python scripts and the same
# `quirm-secrets` for DATABASE_URL + LITELLM_API_KEY. They run in
# `agents-shared` so they sit next to LiteLLM and can hit the
# in-cluster Service without traversing Authelia.
#
# The runner keeps claiming NEW experiments for BENCH_RUN_BUDGET_S, then
# exits 0; an empty queue exits immediately, so the every-1m schedule never
# piles up. concurrencyPolicy: Forbid guarantees one runner pod at a time
# per CronJob, but the SQL locking lets us scale runners horizontally later
# by adding more CronJobs on offset schedules ("0/2 * * * *", ...).
#
# ── Timeout budget (READ BEFORE EDITING) ────────────────────────────────
# This is an unattended research loop: we are in no rush and want complete,
# gradable answers. Timeouts are per-model (see BENCH_MODEL_TIMEOUTS) so the
# slow CPU/MoE `frontier` lane (~1-2 tok/s) is not cut off mid-answer while
# the fast vLLM lanes stay snappy.
#
# INVARIANT: activeDeadlineSeconds  >  BENCH_RUN_BUDGET_S + max(model timeout)
#   else Kubernetes kills the pod mid-run and the answer truncates → graded 0.
#   Current: 1200 > 180 + 900 = 1080  ✓  (90s headroom for pip + grading)
#
# To give a model more time: bump its entry in BENCH_MODEL_TIMEOUTS, and if
# that pushes past the invariant, raise activeDeadlineSeconds to match.
# A long frontier run will, under Forbid, skip the next few 1-minute ticks
# until it finishes — that is expected and harmless (the proposer caps how
# many frontier runs it queues, so frontier never starves the fast lanes).
# NOTE: the `quirm-bench-scripts` ConfigMap is generated by
# bench/kustomization.yaml's configMapGenerator from the canonical
# Python sources at homelab/scripts/bench/. Earlier this file
# carried a placeholder ConfigMap with the same name and the
# generator used `behavior: replace`, but kustomize rejects
# `replace` when the target lives in the same kustomization tree
# (it expects the existing resource to come from a parent base).
# Letting the generator create it fresh is simpler and keeps the
# scripts as the single source of truth.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quirm-bench-runner
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: quirm-bench
    app.kubernetes.io/component: runner
spec:
  schedule: "* * * * *"        # every minute
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # MUST exceed BENCH_RUN_BUDGET_S + max(BENCH_MODEL_TIMEOUTS) so a slow
      # frontier run is never killed mid-generation. 180 + 900 + headroom.
      activeDeadlineSeconds: 1200
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: quirm-bench
            app.kubernetes.io/component: runner
        spec:
          restartPolicy: Never
          containers:
            - name: runner
              image: python:3.12-slim
              env:
                # How long to keep claiming NEW experiments per invocation.
                - { name: BENCH_RUN_BUDGET_S,   value: "180" }
                # Default per-request HTTP timeout for models not listed in
                # BENCH_MODEL_TIMEOUTS below.
                - { name: BENCH_HTTP_TIMEOUT_S, value: "180" }
                # Per-model timeout overrides (JSON, seconds). Merged over the
                # runner's built-in defaults. Bump a value here to give a slow
                # backend more room — then keep the activeDeadlineSeconds
                # invariant above. frontier = CPU 480B MoE on blade (~1-2 tok/s).
                - { name: BENCH_MODEL_TIMEOUTS, value: '{"frontier":900,"long":300}' }
                - { name: OPENAI_BASE_URL, value: "http://litellm.inference.svc.cluster.local:4000/v1" }
                - name: POD_NAME
                  valueFrom: { fieldRef: { fieldPath: metadata.name } }
              envFrom:
                - secretRef: { name: quirm-secrets }
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  pip install --quiet --no-cache-dir 'psycopg[binary]==3.2.*' 'httpx==0.28.*'
                  exec python /opt/quirm-bench/runner.py
              volumeMounts:
                - { name: scripts, mountPath: /opt/quirm-bench }
              resources:
                requests: { cpu: "50m",  memory: "128Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }
          volumes:
            - name: scripts
              configMap:
                name: quirm-bench-scripts
                defaultMode: 0o0755
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quirm-bench-proposer
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: quirm-bench
    app.kubernetes.io/component: proposer
spec:
  schedule: "*/30 * * * *"     # every 30 minutes
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: quirm-bench
            app.kubernetes.io/component: proposer
        spec:
          restartPolicy: Never
          containers:
            - name: proposer
              image: python:3.12-slim
              env:
                - { name: BENCH_MIN_RUNS_PER_PAIR, value: "3" }
                - { name: BENCH_CONFIRM_TOP_N,     value: "3" }
                - { name: BENCH_EXPLORE_PROB,      value: "0.20" }
                - { name: BENCH_MAX_BACKLOG,       value: "120" }
              envFrom:
                - secretRef: { name: quirm-secrets }
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  pip install --quiet --no-cache-dir 'psycopg[binary]==3.2.*'
                  exec python /opt/quirm-bench/proposer.py
              volumeMounts:
                - { name: scripts, mountPath: /opt/quirm-bench }
              resources:
                requests: { cpu: "50m",  memory: "128Mi" }
                limits:   { cpu: "200m", memory: "256Mi" }
          volumes:
            - name: scripts
              configMap:
                name: quirm-bench-scripts
                defaultMode: 0o0755
