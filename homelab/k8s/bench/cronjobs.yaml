---
# Quirm benchmark loop — Karpathy-style auto-research.
#
# runner   every 1m  → executes one queued experiment (FOR UPDATE SKIP LOCKED)
# proposer every 30m → fills coverage gaps, confirms top-N, explores
#
# Both share the same ConfigMap-mounted Python scripts and the same
# `quirm-secrets` for DATABASE_URL + LITELLM_API_KEY. They run in
# `agents-shared` so they sit next to LiteLLM and can hit the
# in-cluster Service without traversing Authelia.
#
# The runner has a tight 180s budget and exits 0 if the queue is empty,
# so the every-1m schedule never piles up. concurrencyPolicy: Forbid
# guarantees only one runner pod at a time per CronJob, but the SQL
# locking lets us scale runners horizontally later by adding more
# CronJobs on offset schedules ("0/2 * * * *", "1/2 * * * *", ...).
apiVersion: v1
kind: ConfigMap
metadata:
  name: quirm-bench-scripts
  namespace: agents-shared
data:
  runner.py: |-
    # NOTE: contents kept in sync with homelab/scripts/bench/runner.py.
    # Edit the source-of-truth file there and re-run kustomize, which
    # regenerates this ConfigMap via the configMapGenerator below.
    placeholder = True
  proposer.py: |-
    placeholder = True
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quirm-bench-runner
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: quirm-bench
    app.kubernetes.io/component: runner
spec:
  schedule: "* * * * *"        # every minute
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240   # >RUN_BUDGET_S so we never lose a row
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: quirm-bench
            app.kubernetes.io/component: runner
        spec:
          restartPolicy: Never
          containers:
            - name: runner
              image: python:3.12-slim
              env:
                - { name: BENCH_RUN_BUDGET_S,   value: "180" }
                - { name: BENCH_HTTP_TIMEOUT_S, value: "120" }
                - { name: OPENAI_BASE_URL, value: "http://litellm.inference.svc.cluster.local:4000/v1" }
                - name: POD_NAME
                  valueFrom: { fieldRef: { fieldPath: metadata.name } }
              envFrom:
                - secretRef: { name: quirm-secrets }
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  pip install --quiet --no-cache-dir 'psycopg[binary]==3.2.*' 'httpx==0.28.*'
                  exec python /opt/quirm-bench/runner.py
              volumeMounts:
                - { name: scripts, mountPath: /opt/quirm-bench }
              resources:
                requests: { cpu: "50m",  memory: "128Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }
          volumes:
            - name: scripts
              configMap:
                name: quirm-bench-scripts
                defaultMode: 0o0755
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quirm-bench-proposer
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: quirm-bench
    app.kubernetes.io/component: proposer
spec:
  schedule: "*/30 * * * *"     # every 30 minutes
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: quirm-bench
            app.kubernetes.io/component: proposer
        spec:
          restartPolicy: Never
          containers:
            - name: proposer
              image: python:3.12-slim
              env:
                - { name: BENCH_MIN_RUNS_PER_PAIR, value: "3" }
                - { name: BENCH_CONFIRM_TOP_N,     value: "3" }
                - { name: BENCH_EXPLORE_PROB,      value: "0.20" }
                - { name: BENCH_MAX_BACKLOG,       value: "120" }
              envFrom:
                - secretRef: { name: quirm-secrets }
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  pip install --quiet --no-cache-dir 'psycopg[binary]==3.2.*'
                  exec python /opt/quirm-bench/proposer.py
              volumeMounts:
                - { name: scripts, mountPath: /opt/quirm-bench }
              resources:
                requests: { cpu: "50m",  memory: "128Mi" }
                limits:   { cpu: "200m", memory: "256Mi" }
          volumes:
            - name: scripts
              configMap:
                name: quirm-bench-scripts
                defaultMode: 0o0755
