---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: quirm
  namespace: agents-shared
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`quirm.leopaska.xyz`)
      kind: Rule
      services:
        - { name: quirm, port: 3001 }
      middlewares:
        - { name: authelia, namespace: authelia }
  tls:
    secretName: quirm-leopaska-tls
    domains:
      - main: quirm.leopaska.xyz
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quirm-leopaska-tls
  namespace: agents-shared
spec:
  secretName: quirm-leopaska-tls
  dnsNames: [quirm.leopaska.xyz]
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
