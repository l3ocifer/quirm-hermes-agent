---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quirm-ops
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: quirm

---
# Self-introspection in agents-shared
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quirm-self
  namespace: agents-shared
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quirm-self
  namespace: agents-shared
subjects:
  - kind: ServiceAccount
    name: quirm-ops
    namespace: agents-shared
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quirm-self

---
# Cluster-wide read-only — Quirm can see "is everything OK" + read
# metrics for benchmarking, but does NOT mutate anything cluster-side.
# Frick handles cluster ops; Quirm only observes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quirm-cluster-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes", "namespaces", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quirm-cluster-readonly
subjects:
  - kind: ServiceAccount
    name: quirm-ops
    namespace: agents-shared
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quirm-cluster-readonly
