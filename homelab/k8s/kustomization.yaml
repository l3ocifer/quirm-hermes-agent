apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Quirm — Hermes Agent researcher / benchmarker / capability expander.
# Floats; soft-prefers thebeast (RAM-heavy). Lives in agents-shared
# alongside the other six agents and the graph PVCs.

namespace: agents-shared

resources:
  - pvc.yaml
  - rbac.yaml
  - service.yaml
  - ingressroute.yaml
  - deployment.yaml

configMapGenerator:
  - name: quirm-persona
    files:
      - SOUL.md=../config/SOUL.md
      - TOOLS.md=../config/TOOLS.md
      - AGENTS.md=../shared/openclaw-configs/shared/AGENTS.md
      - HANDOFF.md=../shared/openclaw-configs/shared/HANDOFF.md
      - KILLSWITCH.md=../shared/openclaw-configs/shared/KILLSWITCH.md
      - USER.md=../shared/openclaw-configs/shared/USER.md
  - name: quirm-hermes-config
    files:
      - config.toml=../config/hermes.toml

generatorOptions:
  disableNameSuffixHash: false

commonLabels:
  app.kubernetes.io/name: quirm
  app.kubernetes.io/part-of: agents
  app.kubernetes.io/managed-by: argocd
